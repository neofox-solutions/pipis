name: Pages

# Publishes the documentation site (apps/docs, built from docs/) to GitHub Pages on each push to main.
# The site is built the way CI builds it (`pnpm exec vp run @pipis/docs#build`); its links are relative, so it works under the
# repository's Pages path. Repository setting: Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# Two jobs, so that the token that can deploy is not the one that installs the repository's dependencies:
#  - build:  read-only token. Installs, builds, and uploads the site as a Pages artifact.
#  - deploy: has the Pages and OIDC permissions, and does nothing but deploy that artifact. No checkout, no install.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a run that is queued behind another is not cancelled, so the latest push is the one that goes out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run @pipis/docs#build
      # GitHub Pages runs Jekyll unless told not to; the site has no Jekyll files, and Jekyll would hide any file starting with `_`.
      - run: touch apps/docs/dist/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
